name: QA

# Full quality gate: biome check, typecheck, unit + component tests, production
# build, and the Playwright e2e suite (hermetic + DB-backed @live-db against an
# ephemeral Postgres container), plus the demo login's @demo suite on a demo
# production build. Runs standalone on pull requests and as a
# reusable workflow (workflow_call) gating the Docker publish on main.
on:
  pull_request:
    branches: [main]
    # Doc-only and sample-spec changes don't affect the build or tests — skip the
    # gate when a PR touches nothing but Markdown, docs, or the authored activity
    # specs (a mixed PR still runs the full suite).
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'activities/**'
  workflow_call:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this gate only reads the code and runs tests — it never needs
# to write to the repo. (Fork PRs already get a read-only token and NO secrets;
# this also constrains the token on same-repo runs.)
permissions:
  contents: read

# SECURITY: this workflow must stay secret-free. It runs on fork pull_request,
# where untrusted PR code executes — anything in the environment here is
# exfiltratable. The values below are test-only DUMMIES (NOT secrets). LLM-backed
# e2e specs run here against the fake LLM (fake-llm/server.mjs, started by the
# Playwright config — no key, no network). Tests needing a REAL model or a specific
# provider (SCCH is geo-blocked to Austria, un-containerizable) are tagged
# @live-llm and excluded via `npm run test:e2e:ci`; they stay local-only, as do
# the @live-storage (real image mount) and @live-telemetry (real App Insights
# query API, docs/diagnostics.md) tests. The DB-backed tests are tagged @live-db and DO run here, against the ephemeral
# Postgres service in the e2e job (reached with a throwaway password — the
# container's password is a non-secret DUMMY, so secret-freeness holds). Live
# credentials (real Azure Postgres / SCCH) must NEVER be added here or run on a
# fork pull_request — only on a trusted trigger (push to main, a schedule, or a
# reviewer-gated environment). See docker-publish.yml for the secret-bearing
# main-only path.
#
# NOVEDU_AUTH_MODE is set explicitly, so a stray value can never flip a build:
# every job here builds and tests the Entra build, except `e2e-demo` (and the
# `demo` leg of `prod-build`), which builds the demo login (docs/auth.md, "Demo
# mode").
#
# auth.ts (the better-auth instance) of an Entra build requires the AZURE_* vars
# and TEACHER_GROUP_ID at module load (also during `next build`), and its drizzle
# adapter is constructed from DATABASE_URL at that same module load — the pool
# never connects during a build, so a placeholder connection string is enough.
# AUTH_SECRET only needs to match between the e2e helpers and the dev server
# (e2e tests mint session cookies directly, so no real Entra round-trip
# happens). Next's loadEnvConfig never overrides existing process.env, so no
# .env file is needed here. The `e2e` job below sets its own DATABASE_URL at
# job level, which overrides this workflow-level placeholder with the
# ephemeral Postgres container's real connection string.
env:
  NOVEDU_AUTH_MODE: entra
  AUTH_SECRET: ci-e2e-auth-secret
  AZURE_CLIENT_ID: ci-placeholder
  AZURE_CLIENT_SECRET: ci-placeholder
  AZURE_TENANT_ID: ci-placeholder
  TEACHER_GROUP_ID: ci-placeholder
  DATABASE_URL: postgresql://build:placeholder@localhost:5432/build

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Component tests run in Vitest browser mode on Playwright Chromium.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # `--with-deps` adds a few fonts through apt; every library Chromium needs
      # is already on the runner image. When the Ubuntu mirrors are unreachable,
      # install the browser alone instead of failing the job.
      - run: timeout 120 npx playwright install --with-deps chromium || npx playwright install chromium

      - run: npm run check

      - run: npm run typecheck

      - run: npm run test:unit

      - run: npm run test:component

      # The CLI's integration suite (cli/test/*): drives the built binary against
      # the offline fixtures server, so it needs no secret and no infra. Its
      # colocated unit tests already ride `test:unit`; this is the other half.
      - run: npm run test:cli

      - run: npm run build

      # The Entra build carries none of the demo login: neither the public demo
      # password nor the demo boot's log line appears in its compiled output.
      - run: node scripts/ci/check-demo-markers.mjs .next --expect absent

      # Teacher guide (Astro static export) — fails fast on schema violations and
      # dead related: slugs in the corpus. Corpus-only (.md) PRs skip this whole
      # workflow via paths-ignore; docs.yml covers those.
      - run: npm run docs:build

  e2e:
    runs-on: ubuntu-latest
    # Ephemeral Postgres so the DB-backed @live-db tests run here via a throwaway
    # password (NOT Entra). The container's password is a non-secret DUMMY
    # literal, so this stays secret-free / fork-safe. LLM calls go to the fake LLM
    # the Playwright config starts; the @live-llm tests (a real model or a specific
    # provider) are NOT run here — they stay local.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: "Test-Passw0rd!" # dummy, non-secret — see docs/ci-security.md
          POSTGRES_DB: novedu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Password auth → the container. The password is the dummy literal above,
      # NOT a secret. The image creates the `novedu` database itself.
      DATABASE_URL: "postgresql://postgres:Test-Passw0rd!@localhost:5432/novedu"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # `--with-deps` adds a few fonts through apt; every library Chromium needs
      # is already on the runner image. When the Ubuntu mirrors are unreachable,
      # install the browser alone instead of failing the job.
      - run: timeout 120 npx playwright install --with-deps chromium || npx playwright install chromium

      # The postgres:18 image creates the `novedu` database itself; the app
      # creates the `mastra` schema and every table at boot (instrumentation.ts).
      # This step only waits for the service to accept connections.
      - name: Wait for Postgres
        run: node scripts/ci/wait-for-db.mjs

      # Runs hermetic + @live-db (against the container and the fake LLM),
      # excludes @live-llm, @live-storage and @live-telemetry.
      # Playwright's webServer boots `npm run dev`, which migrates novedu_* on start.
      - run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The demo login (docs/auth.md, "Demo mode") on a PRODUCTION build: Playwright's
  # web server runs `next build` + `next start` in demo mode, so this exercises the
  # build-time switch, the production rate limit and the real boot (env lock,
  # provenance preflight, persona seed) — and runs ONLY the `@demo` specs
  # (playwright.config.ts picks the suite by mode). Secret-free like `e2e`: the
  # same throwaway Postgres container, no credential of any kind.
  e2e-demo:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: "Test-Passw0rd!" # dummy, non-secret — see docs/ci-security.md
          POSTGRES_DB: novedu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: "postgresql://postgres:Test-Passw0rd!@localhost:5432/novedu"
      NOVEDU_AUTH_MODE: demo
      # A demo build refuses to build or boot with any Entra setting present —
      # blank the workflow-level placeholders.
      AZURE_CLIENT_ID: ""
      AZURE_CLIENT_SECRET: ""
      AZURE_TENANT_ID: ""
      TEACHER_GROUP_ID: ""
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # `--with-deps` adds a few fonts through apt; every library Chromium needs
      # is already on the runner image. When the Ubuntu mirrors are unreachable,
      # install the browser alone instead of failing the job.
      - run: timeout 120 npx playwright install --with-deps chromium || npx playwright install chromium

      - name: Wait for Postgres
        run: node scripts/ci/wait-for-db.mjs

      - run: npm run test:e2e:ci

      # Positive control for the `qa` job's absent-check: the demo build Playwright
      # just ran DOES carry both markers, so the check can tell the builds apart.
      - run: node scripts/ci/check-demo-markers.mjs .next --expect present

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-demo
          path: playwright-report/
          retention-days: 7

  # Production Docker build (NO push) — reproduces the multi-stage image build
  # exactly as docker-publish.yml does it, so a build break surfaces on the PR
  # instead of only after merge during CD. The plain `npm run build` step in the
  # `qa` job runs with ALL deps installed and so cannot catch breakage that only
  # appears in the layered image (e.g. the deps stage copies just the root
  # package.json, so a workspace's deps aren't installed when `next build`
  # runs) — only an actual Docker build does.
  #
  # Secret-free, same as the rest of this workflow: the Dockerfile bakes
  # build-only placeholder env, and we never log in or push. PR-only — on a main
  # push (workflow_call) the real build+push in docker-publish.yml is the gate,
  # so building here too would just be a redundant ~4-minute rebuild.
  #
  # One leg per published image: the production (Entra) image and `:demo`. Each
  # leg checks the shipped artifact itself for the demo markers — absent from the
  # Entra image, present in the demo image. The demo leg then boots compose.yaml
  # on its image and smoke-tests the demo login against it.
  prod-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: entra
            markers: absent
            cache-from: type=gha,scope=entra
          - mode: demo
            markers: present
            cache-from: |
              type=gha,scope=demo
              type=gha,scope=entra
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the ${{ matrix.mode }} image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: novedu-prod-build:${{ matrix.mode }}
          build-args: NOVEDU_AUTH_MODE=${{ matrix.mode }}
          # Read the layer cache the main publish populates (one scope per
          # image); don't write it (cache export is restricted for fork
          # pull_request tokens).
          cache-from: ${{ matrix.cache-from }}

      - name: Check the image's sign-in mode
        run: |
          out="$RUNNER_TEMP/image-app"
          mkdir -p "$out"
          id=$(docker create "novedu-prod-build:${{ matrix.mode }}")
          docker cp "$id:/app/server.js" "$out/server.js"
          docker cp "$id:/app/.next" "$out/.next"
          docker rm "$id"
          node scripts/ci/check-demo-markers.mjs "$out" --expect ${{ matrix.markers }}

      # The demo leg also boots compose.yaml on the image it just built, beside
      # a fake LLM image built from this PR, and signs in through the demo
      # login (scripts/ci/compose-smoke.mjs). Its passwords are the published
      # dummies in compose.yaml — no secret involved.
      - name: Build the fake LLM image (no push)
        if: matrix.mode == 'demo'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: fake-llm/Dockerfile
          push: false
          load: true
          tags: novedu-fake-llm:ci
          cache-from: type=gha,scope=fake-llm

      - name: Start compose.yaml
        if: matrix.mode == 'demo'
        env:
          NOVEDU_IMAGE: novedu-prod-build:demo
          NOVEDU_FAKE_LLM_IMAGE: novedu-fake-llm:ci
        run: docker compose up -d --wait --wait-timeout 180

      - name: Smoke-test compose.yaml
        if: matrix.mode == 'demo'
        run: node scripts/ci/compose-smoke.mjs

      - name: Compose logs
        if: failure() && matrix.mode == 'demo'
        run: docker compose logs --no-color

      - name: Stop compose.yaml
        if: always() && matrix.mode == 'demo'
        run: docker compose down -v
