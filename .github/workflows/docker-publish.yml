name: Build and publish Docker image

on:
  push:
    branches: [main]
    # A doc-only, sample-spec or dev-tooling (agent skills, worktree config)
    # push doesn't change the image — skip the build/publish/deploy entirely.
    # Mixed pushes (code + docs) still publish.
    # EXCEPTION: teacher-docs/** is re-included (last matching pattern wins).
    # The image no longer contains the guide, but its version is the release
    # unit: promote.yml builds the guide from the promoted image's commit, so a
    # corpus change needs an image of its own to ever reach docs.novedu.at.
    # Manual runs (workflow_dispatch) always build regardless of what changed.
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!activities/**'
      - '!.agents/**'
      - '!.claude'
      - '!.worktreeinclude'
      - 'teacher-docs/**'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/htl-leo-novedu/novedu-app

# Least privilege: every job gets a read-only token unless it asks for more.
# Only the two publishing jobs, `build-and-push` and `build-and-push-demo`, may
# write packages (the GHCR push); only `deploy-dev` may request an OIDC token
# and read packages. The called qa.yml stays read-only.
permissions:
  contents: read

jobs:
  # Quality gate: nothing is built or published unless the full QA suite
  # (check, typecheck, unit + component tests, build, hermetic e2e, the demo
  # login's e2e) is green.
  qa:
    uses: ./.github/workflows/qa.yml

  # Builds the image ONCE and pushes it to GHCR (the public package
  # `novedu-app`), the build artifact the `deploy-dev` job below copies into
  # the Azure registry. Production is the prod stage, reached only through the
  # manual promote.yml (docs/azure-runtime-env.md).
  build-and-push:
    needs: qa
    runs-on: ubuntu-latest
    # The built-in GITHUB_TOKEN pushes to GHCR — no stored registry credential.
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Image version = package.json version + "." + an ever-increasing build
      # number (the workflow run number, which also increments on manual runs).
      # built_at is baked into the image too so /api/version can report it.
      - name: Derive image version
        id: version
        run: |
          echo "version=$(jq -r .version package.json).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # amd64 only: Azure Container Apps runs amd64, and building the arm64
          # variant under QEMU emulation takes far too long. Build arm64
          # locally on a Mac if ever needed (the Dockerfile is multi-arch).
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          # Baked into the image (Dockerfile ARG -> ENV) so the running container
          # can report its identity via /api/version and /health (lib/version.ts).
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_GIT_SHA=${{ github.sha }}
            APP_BUILD_TIME=${{ steps.version.outputs.built_at }}
          # A push with GITHUB_TOKEN links the package to this repo by itself;
          # the label keeps that link for a push made outside Actions.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # One cache scope per image, so the demo image's build never evicts
          # this one's layers (and vice versa).
          cache-from: type=gha,scope=entra
          cache-to: type=gha,mode=max,scope=entra

  # The `:demo` image (docs/auth.md, "Demo mode"): the same app built with the
  # one-click demo login instead of Entra ID, for evaluators, training setups and
  # contributors. Its own job — it needs `qa`, not `build-and-push` — so it never
  # delays or fails the dev deploy. Nothing deploys it: no stage runs a demo
  # image, and promote.yml's version check rejects its `-demo` versions.
  #
  # The same job also pushes the fake LLM image (`:fake-llm`,
  # fake-llm/Dockerfile) that compose.yaml runs beside `:demo`, under the same
  # repository and login — `-fake-llm` versions are rejected by promote.yml too.
  build-and-push-demo:
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The production image's version with a `-demo` suffix, so /api/version
      # names a demo image as one; the fake LLM image's with `-fake-llm`.
      - name: Derive image version
        id: version
        run: |
          base="$(jq -r .version package.json).${{ github.run_number }}"
          echo "version=$base-demo" >> "$GITHUB_OUTPUT"
          echo "fake_llm_version=$base-fake-llm" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:demo
          build-args: |
            NOVEDU_AUTH_MODE=demo
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_GIT_SHA=${{ github.sha }}
            APP_BUILD_TIME=${{ steps.version.outputs.built_at }}
          # Its own scope; the dependency layers it shares with the production
          # image come from that image's scope.
          cache-from: |
            type=gha,scope=demo
            type=gha,scope=entra
          cache-to: type=gha,mode=max,scope=demo

      # The fake LLM is plain JavaScript, so its arm64 variant builds quickly
      # under QEMU — Apple silicon runs it natively.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and push the fake LLM image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: fake-llm/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.fake_llm_version }}
            ${{ env.IMAGE_NAME }}:fake-llm
          cache-from: type=gha,scope=fake-llm
          cache-to: type=gha,mode=max,scope=fake-llm

  # Every publish deploys to the dev stage (docs/azure-runtime-env.md).
  # Promotion to the prod stage is the manual promote.yml.
  #
  # SECURITY: no secrets here. Azure trusts this job by OIDC federation — the
  # dev identity accepts a token only for this repo's `refs/heads/main`, so a
  # run from any other ref (or a fork) cannot log in (docs/ci-security.md).
  deploy-dev:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.build-and-push.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_DEV_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Reads the image with the built-in token, so the copy works whatever the
      # package's visibility (a new GHCR package starts out private).
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry-to-registry copy of the image built above: same digest, so both
      # stages run exactly what was built and tested. Only the immutable version tag
      # goes to the registry, never :latest. The stages pull from the Azure
      # registry, not from GHCR, so a container start never depends on GHCR; the
      # copy can go once the app moves to on-prem hosting.
      - name: Copy the image to the Azure registry
        run: |
          az acr login --name crnovedu
          docker buildx imagetools create \
            --tag "crnovedu.azurecr.io/novedu:$VERSION" \
            "$IMAGE_NAME:$VERSION"

      - name: Deploy to dev
        uses: ./.github/actions/deploy-stage
        with:
          stage: dev
          version: ${{ env.VERSION }}
          base-url: ${{ vars.DEV_BASE_URL }}
